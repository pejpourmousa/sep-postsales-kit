<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<title>Automated QBR Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  color-scheme: light;
  --ink:#14213D; --ink-2:#3B4760; --muted:#6B7488; --line:#DCE0E8;
  --paper:#FFFFFF; --tint:#F6F4F1; --canvas:#E7E9EE; --accent:#EB6A2E; --accent-soft:#FDEEE6;
  --hs:#FF7A59; --sf:#29B5E8; --calc:#7A5AF8; --csm:#C28A00;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line);}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar h1{font:700 15px/1.2 var(--display);margin:0;letter-spacing:.01em}
.bar .meta{font-size:13px;color:var(--muted)}
.bar .sp{flex:1}
.tg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.tg input{accent-color:var(--accent);width:15px;height:15px}
.btn{font:600 13px var(--body);border-radius:6px;padding:7px 13px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:focus-visible,.tg input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);min-height:1em}
.deck{max-width:1180px;margin:0 auto;padding-block:22px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:22px}
.frame{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 1px 2px rgba(20,33,61,.08),0 8px 24px rgba(20,33,61,.08);background:var(--paper)}
.frame.setup{outline:2px dashed var(--accent);outline-offset:4px}
.slide{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(var(--k,.5));background:var(--paper);overflow:hidden}
.slide.dark{background:var(--ink);color:#fff}

/* chrome */
.eyebrow{position:absolute;left:56px;top:40px;font:700 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.title{position:absolute;left:56px;top:60px;right:200px;font:800 38px/1.1 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.title em{font-style:normal;color:var(--accent)}
.sub{position:absolute;left:56px;top:112px;right:200px;font-size:17px;color:var(--ink-2);line-height:1.35}
.sub b{color:var(--ink)}
.mark{position:absolute;right:56px;top:40px;display:flex;align-items:center;gap:8px;font:700 15px var(--display);color:var(--ink)}
.mark i{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 14px var(--display);font-style:normal}
.dark .mark{color:#fff}
.foot{position:absolute;left:56px;right:56px;bottom:26px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.body{position:absolute;left:56px;right:56px;top:176px;bottom:68px;display:flex;flex-direction:column;gap:20px}

/* blocks */
.tiles{display:grid;gap:20px}
.tile{position:relative;border:1px solid var(--line);border-top:3px solid var(--accent);background:var(--paper);padding:22px 22px 18px;display:flex;flex-direction:column;gap:6px}
.tile .v{font:800 52px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .v .ph{font-size:28px;vertical-align:middle}
.tile .l{font:700 16px var(--display);margin-top:10px}
.tile .s{font-size:14px;color:var(--muted)}
.card{position:relative;background:var(--tint);border-top:3px solid var(--accent);padding:20px 22px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font:700 19px/1.2 var(--display)}
.card p{margin:0;font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.card .tag{font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.callout{background:var(--accent-soft);padding:16px 20px;font-size:16px;line-height:1.4;color:var(--ink);margin-top:auto}
.callout b{color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.t th{background:var(--ink);color:#fff;font:700 13px var(--display);letter-spacing:.04em;text-align:left;padding:11px 14px}
.t td{padding:10px 14px;border-bottom:1px solid var(--line)}
.t tr:nth-child(even) td{background:var(--tint)}
.t .r{text-align:right}.t .c{text-align:center}
.pos{color:#1F8A5B;font-weight:700}.neg{color:#B3261E;font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font:700 12px var(--display);letter-spacing:.03em}
.st-achieved{background:#E3F4EC;color:#1F7A50}.st-ontrack{background:#E6EEFB;color:#2B5FBF}.st-focus{background:#FDF0DC;color:#9A5A00}.st-atrisk{background:#FBE6E4;color:#B3261E}.st-shipped{background:#E3F4EC;color:#1F7A50}.st-inbeta{background:#E6EEFB;color:#2B5FBF}.st-planned{background:#EEE9FD;color:#5B3FC4}.st-underreview{background:#FDF0DC;color:#9A5A00}.st-notplanned{background:#ECEEF2;color:#5A6378}
.col{display:flex;flex-direction:column;gap:12px}.col-h{display:flex;align-items:baseline;gap:10px;border-bottom:3px solid var(--ink);padding-bottom:8px}.col-h b{font:800 22px var(--display)}.col-h span{font-size:14px;color:var(--muted)}
.col:first-child .col-h{border-color:var(--accent)}
.ph{background:#FFF4CC;outline:1px dashed #C28A00;padding:0 4px;border-radius:2px;color:#7A5600}
.cap{font:700 14px var(--display);color:var(--ink-2)}
.cap span{font-weight:500;color:var(--muted)}

/* source chips */
.chip{display:none;position:absolute;top:8px;right:8px;font:500 10.5px var(--mono);padding:3px 7px;border-radius:3px;color:#fff;white-space:nowrap;z-index:2}
.show-src .chip{display:inline-block}
.chip.hubspot{background:var(--hs)}.chip.snowflake{background:#1B8DB8}.chip.calc{background:var(--calc)}.chip.csm{background:var(--csm)}.chip.claude{background:var(--ink-2)}
.srcstrip{display:none;position:absolute;right:56px;top:80px;gap:6px;flex-direction:column;align-items:flex-end}
.show-src .srcstrip{display:flex}
.srcstrip .chip{position:static;display:inline-block}

/* cover / section / close */
.cover .band{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--accent)}
.cover .k{position:absolute;left:84px;top:220px;font:700 13px var(--display);letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.cover h2{position:absolute;left:84px;top:246px;margin:0;font:800 74px/1 var(--display);letter-spacing:-.02em}
.cover h2 em{font-style:normal;color:var(--accent)}
.cover .hl{position:absolute;left:84px;top:350px;font-size:24px;color:#C9D0DE;max-width:860px;line-height:1.3}
.cover .dates{position:absolute;left:84px;top:430px;border:1.5px solid var(--accent);padding:10px 22px;font:700 16px var(--display)}
.cover .by{position:absolute;left:84px;bottom:56px;font-size:14px;color:#8F9AB0}
.section .num{position:absolute;left:84px;top:230px;font:800 150px/1 var(--display);color:var(--accent);letter-spacing:-.03em}
.section .num small{font-size:44px;color:#8F9AB0;font-weight:700;letter-spacing:0}
.section h2{position:absolute;left:84px;top:410px;margin:0;font:800 52px var(--display)}
.section .rule{position:absolute;left:84px;top:488px;width:56px;height:5px;background:var(--accent)}
.section p{position:absolute;left:84px;top:508px;font-size:20px;color:#C9D0DE}

/* setup */
.setup-badge{position:absolute;right:56px;top:40px;font:700 12px var(--display);letter-spacing:.12em;background:var(--accent);color:#fff;padding:6px 12px;border-radius:3px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:var(--tint);padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--ink)}
.step .n{font:800 30px var(--display);color:var(--accent);line-height:1}
.step h3{margin:0;font:700 17px/1.2 var(--display)}
.step p{margin:0;font-size:14px;line-height:1.42;color:var(--ink-2)}
.prompt{background:var(--ink);color:#EDEFF4;padding:16px 20px;font:500 14px/1.5 var(--mono);border-left:4px solid var(--accent)}
.prompt .lbl{display:block;font:700 11px var(--display);letter-spacing:.14em;color:var(--accent);margin-bottom:6px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.team{display:flex;gap:28px;justify-content:center;padding-top:10px}
.person{position:relative;width:380px;background:var(--tint);padding:34px 28px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);display:grid;place-items:center;font:800 26px var(--display);color:var(--accent);margin-bottom:8px}
.person h3{margin:0;font:800 22px var(--display)}
.person .role{font:700 14px var(--display);color:var(--accent)}
.person p{margin:0;font-size:15px;color:var(--ink-2)}
svg text{font-family:var(--body)}
@media (max-width:640px){.bar .meta{display:none}}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s}}
</style>

<div class="bar"><div class="bar-in">

/* ===================== deck definition ===================== */
const M = QBR.meta;
const SRC = { hubspot:"HubSpot", snowflake:"Snowflake", calc:"Calculated", csm:"CSM input", claude:"Claude draft" };
function deckSpec(){
  return [
    { kind:"setupSteps", setup:true },
    { kind:"setupMap", setup:true },

/* ===================== HTML renderer ===================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ph = s => esc(s).replace(/\[(CSM to fill|tbd)\]/g, '<span class="ph">[$1]</span>');
const chip = src => src ? `<span class="chip ${src}" title="Source: ${SRC[src]}">${SRC[src]}</span>` : "";
const titleHTML = t => `${esc(t[0])}<em>${esc(t[1]||"")}</em>${esc(t[2]||"")}`;
const subHTML = s => `<b>${esc(s[0])}</b>${esc(s[1]||"")}`;
const markHTML = () => `<div class="mark"><i>${esc(M.vendorInitial)}</i>${esc(M.vendor)}</div>`;
const statusCls = s => "st-" + s.toLowerCase().replace(/\s/g,"");
function deltaCls(v, down){ if(/^\+/.test(v)) return down?"neg":"pos"; if(/^[−-]/.test(v)) return down?"pos":"neg"; return ""; }

function chrome(s, num, total){
  return `<div class="eyebrow">${esc(s.eyebrow)}</div><h2 class="title">${titleHTML(s.title)}</h2>
  <div class="sub">${subHTML(s.sub)}</div>${markHTML()}
  ${s.src?`<div class="srcstrip">${chip(s.src)}</div>`:""}
  <div class="foot"><span>${esc(M.customer)}  ·  ${esc(M.periodLabel)}</span><span>${num} / ${total}</span></div>`;
}
function callout(c){ return c ? `<div class="callout"><b>${esc(c.lead)}</b> ${esc(c.text)}</div>` : ""; }
function tile(t){ return `<div class="tile">${chip(t.src)}<div class="v">${ph(t.v)}</div><div class="l">${esc(t.l)}</div><div class="s">${esc(t.s)}</div></div>`; }
function card(c, big){ return `<div class="card" style="${big?'flex:1':''}">${chip(c.src)}${c.tag?`<div class="tag">${esc(c.tag)}</div>`:""}<h3>${ph(c.title)}</h3><p>${ph(c.body)}</p></div>`; }

function svgChart(s){
  const W=1168, H=s.callout?330:410, padL=10, padB=34, padT=26;
  const all = s.series.flatMap(x=>x.values).concat(s.ref?[s.ref.value]:[]);
  const max = Math.max(...all)*1.12;
  const n=s.labels.length, groupW=(W-padL*2)/n, k=s.series.length, bw=Math.min(54,(groupW*.62)/k);
  const y = v => padT + (H-padT-padB)*(1-v/max);
  const colors = k===1?["var(--ink)"]:["#AEB6C6","var(--accent)"];
  let g = `<line x1="0" x2="${W}" y1="${H-padB}" y2="${H-padB}" stroke="var(--line)" stroke-width="1.5"/>`;
  s.labels.forEach((lab,i)=>{
    const cx = padL + groupW*i + groupW/2, start = cx - (bw*k + 6*(k-1))/2;
    s.series.forEach((ser,j)=>{
      const v=ser.values[i], x=start+j*(bw+6), yy=y(v);
      g+=`<rect x="${x}" y="${yy}" width="${bw}" height="${H-padB-yy}" fill="${colors[j]}"/>`;
      g+=`<text x="${x+bw/2}" y="${yy-7}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${v.toLocaleString()}${s.fmt||""}</text>`;
    });
    g+=`<text x="${cx}" y="${H-padB+22}" text-anchor="middle" font-size="14" fill="var(--muted)">${esc(lab)}</text>`;
  });
  if(s.ref){ const ry=y(s.ref.value); g+=`<line x1="0" x2="${W}" y1="${ry}" y2="${ry}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/><text x="${W-4}" y="${ry-8}" text-anchor="end" font-size="13" font-weight="700" fill="var(--accent)">${esc(s.ref.label)}</text>`; }
  const legend = k>1 ? `<div class="legend">${s.series.map((x,j)=>`<span><i style="background:${colors[j]}"></i>${esc(x.name)}</span>`).join("")}</div>` : "";
  return `<div style="display:flex;justify-content:space-between;align-items:center"><div class="cap">${esc(s.caption[0])}<span>${esc(s.caption[1]||"")}</span></div>${legend}</div>
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(s.caption.join(''))}">${g}</svg>`;
}

function tableHTML(s){
  const head = s.head.map((h,i)=>`<th class="${s.align[i]}" style="width:${s.colW[i]*100}%">${esc(h)}</th>`).join("");
  const rows = s.rows.map(r=>{
    const down = (s.goodWhenDown||[]).includes(s.rows.indexOf(r));
    return "<tr>"+r.map((c,i)=>{
      let inner = ph(c);
      if(i===s.statusCol) inner = `<span class="pill ${statusCls(c)}">${esc(c)}</span>`;
      if(i===s.deltaCol) inner = `<span class="${deltaCls(c,down)}">${esc(c)}</span>`;
      return `<td class="${s.align[i]}">${inner}</td>`;
    }).join("")+"</tr>";
  }).join("");
  return `<table class="t"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}

const P = v => v/96;               // px on the 1280×720 canvas → inches (13.333 × 7.5)
const PT = v => v*0.75;            // px → pt
const hx = c => c.replace("#","");
const C = { ink:"14213D", ink2:"3B4760", muted:"6B7488", line:"DCE0E8", tint:"F6F4F1", accentSoft:"FDEEE6", white:"FFFFFF", grey:"AEB6C6" };
const FONT = "Arial";
const stripPh = s => s; // placeholders exported as plain text so CSMs can find/replace

function pChrome(pptx, sl, s, num, total){

    { x:P(56), y:P(110), w:P(1020), h:P(30), fontFace:FONT, fontSize:PT(16), margin:0, valign:"top" });

  sl.addText(`${num} / ${total}`, { x:P(1024), y:P(680), w:P(200), h:P(20), fontFace:FONT, fontSize:9, color:C.muted, align:"right", margin:0 });

function pMark(pptx, sl, x, y, dark){
  sl.addText(M.vendorInitial, { shape:pptx.ShapeType.roundRect, rectRadius:0.06, x:P(x), y:P(y), w:P(26), h:P(26), fill:{color:hx(M.accent)}, color:C.white, bold:true, fontFace:FONT, fontSize:11, align:"center", valign:"middle", margin:0 });
  sl.addText(M.vendor, { x:P(x+32), y:P(y), w:P(140), h:P(26), fontFace:FONT, fontSize:12, bold:true, color:dark?C.white:C.ink, valign:"middle", margin:0 });
}
function pCallout(sl, c, y){
  if(!c) return;
  sl.addShape("rect", { x:P(56), y:P(y), w:P(1168), h:P(64), fill:{color:C.accentSoft}, line:{color:C.accentSoft} });
  sl.addText([{text:c.lead+" ", options:{bold:true,color:hx(M.accent)}},{text:c.text, options:{color:C.ink}}],
    { x:P(76), y:P(y), w:P(1128), h:P(64), fontFace:FONT, fontSize:PT(15.5), valign:"middle", margin:0 });
}
function pTiles(sl, tiles, y, h){
  const n=tiles.length, gap=20, w=(1168-gap*(n-1))/n;
  tiles.forEach((t,i)=>{
    const x=56+i*(w+gap);
    sl.addShape("rect", { x:P(x), y:P(y), w:P(w), h:P(h), fill:{color:C.white}, line:{color:C.line, width:0.75} });
    sl.addShape("rect", { x:P(x), y:P(y), w:P(w), h:P(3), fill:{color:hx(M.accent)}, line:{color:hx(M.accent), width:0} });
    sl.addText(t.v, { x:P(x+22), y:P(y+22), w:P(w-44), h:P(58), fontFace:FONT, fontSize:n>3?34:40, bold:true, color:C.ink, margin:0, valign:"top", fit:"shrink" });
    sl.addText(t.l, { x:P(x+22), y:P(y+92), w:P(w-44), h:P(24), fontFace:FONT, fontSize:PT(16), bold:true, color:C.ink, margin:0 });
    sl.addText(t.s, { x:P(x+22), y:P(y+118), w:P(w-44), h:P(40), fontFace:FONT, fontSize:PT(14), color:C.muted, margin:0, valign:"top" });
  });
}
function pCards(sl, items, cols, y, h, gap=20){
  const rows = Math.ceil(items.length/cols), w=(1168-gap*(cols-1))/cols, ch=(h-gap*(rows-1))/rows;
  items.forEach((c,i)=>{
    const x=56+(i%cols)*(w+gap), yy=y+Math.floor(i/cols)*(ch+gap);
    sl.addShape("rect", { x:P(x), y:P(yy), w:P(w), h:P(ch), fill:{color:C.tint}, line:{color:C.tint, width:0} });
    sl.addShape("rect", { x:P(x), y:P(yy), w:P(w), h:P(3), fill:{color:hx(M.accent)}, line:{color:hx(M.accent), width:0} });
    const runs=[];
    if(c.tag) runs.push({text:c.tag.toUpperCase(), options:{fontSize:8.5, bold:true, color:C.muted, breakLine:true}});
    runs.push({text:c.title, options:{fontSize:PT(19), bold:true, color:C.ink, breakLine:true}});
    runs.push({text:c.body, options:{fontSize:PT(15), color:C.ink2}});
    sl.addText(runs, { x:P(x+22), y:P(yy+16), w:P(w-44), h:P(ch-28), fontFace:FONT, valign:"top", margin:0, paraSpaceAfter:4 });
  });
}
function pTable(sl, s, y){
  const A = hx(M.accent);
  const stFill = {"achieved":["E3F4EC","1F7A50"],"on track":["E6EEFB","2B5FBF"],"focus":["FDF0DC","9A5A00"],"at risk":["FBE6E4","B3261E"],"shipped":["E3F4EC","1F7A50"],"in beta":["E6EEFB","2B5FBF"],"planned":["EEE9FD","5B3FC4"],"under review":["FDF0DC","9A5A00"],"not planned":["ECEEF2","5A6378"]};
  const al = a => a==="r"?"right":a==="c"?"center":"left";
  const head = s.head.map((h,i)=>({ text:h, options:{ bold:true, color:C.white, fill:{color:C.ink}, align:al(s.align[i]), fontSize:10 } }));
  const body = s.rows.map((r,ri)=>r.map((c,i)=>{
    const o = { color:C.ink, align:al(s.align[i]), fill:{color: ri%2 ? C.tint : C.white}, fontSize:11 };
    if(/\[(CSM to fill|tbd)\]/.test(c)) o.color="9A5A00";
    if(i===s.statusCol){ const f=stFill[c.toLowerCase()]||[C.tint,C.ink]; o.fill={color:f[0]}; o.color=f[1]; o.bold=true; }
    if(i===s.deltaCol){ const down=(s.goodWhenDown||[]).includes(ri); const cls=deltaCls(c,down); if(cls){o.color=cls==="pos"?"1F8A5B":"B3261E"; o.bold=true;} }
    return { text:c, options:o };
  }));
  sl.addTable([head, ...body], { x:P(56), y:P(y), w:P(1168), colW:s.colW.map(f=>P(1168*f)), fontFace:FONT, rowH:P(40), valign:"middle",
    border:{ type:"solid", pt:0.5, color:C.line }, margin:[0,0.1,0,0.1] });
}
function pChart(pptx, sl, s, y, h){
  sl.addText([{text:s.caption[0], options:{bold:true,color:C.ink2}},{text:s.caption[1]||"", options:{color:C.muted}}], { x:P(56), y:P(y), w:P(900), h:P(22), fontFace:FONT, fontSize:11, margin:0 });
  const data = s.series.map(x=>({ name:x.name, labels:s.labels, values:x.values }));
  const colors = s.series.length===1 ? [C.ink] : [C.grey, hx(M.accent)];
  const types = [{ type:pptx.ChartType.bar, data, options:{ barDir:"col", barGrouping:"clustered", chartColors:colors, barGapWidthPct:60 } }];
  if(s.ref) types.push({ type:pptx.ChartType.line, data:[{ name:s.ref.label, labels:s.labels, values:s.labels.map(()=>s.ref.value) }], options:{ chartColors:[hx(M.accent)], lineDash:"dash", lineSize:2, lineDataSymbol:"none" } });
  const opts = { x:P(56), y:P(y+26), w:P(1168), h:P(h-26), showLegend:true, legendPos:"t", legendFontSize:10, legendFontFace:FONT,
    showValue:true, dataLabelFontSize:9, dataLabelColor:C.ink, dataLabelFormatCode: s.fmt==="%" ? '0"%"' : "#,##0",
    catAxisLabelFontSize:10, catAxisLabelColor:C.muted, catAxisLabelFontFace:FONT, valAxisHidden:true, valGridLine:{style:"none"}, valAxisMinVal:0 };
  if(types.length>1) sl.addChart(types, opts);
  else sl.addChart(types[0].type, data, { ...opts, ...types[0].options });
}
function pDarkBase(pptx, sl){
  sl.background = { color:C.ink };
  sl.addShape("rect", { x:0, y:0, w:P(14), h:7.5, fill:{color:hx(M.accent)}, line:{color:hx(M.accent), width:0} });
}

function buildPptx(includeSetup){
  const pptx = new PptxGenJS();
  pptx.layout = "LAYOUT_WIDE";
  pptx.title = `${M.customer} ${M.periodLabel} Business Review`;
  pptx.company = M.vendor;
  const spec = deckSpec(), total = spec.filter(s=>!s.setup).length;
  let num=0;
  spec.forEach(s=>{
    if(s.setup && !includeSetup) return;
    if(!s.setup) num++;
    const sl = pptx.addSlide();
    const A = hx(M.accent);
    switch(s.kind){
      case "setupSteps": {
        s = { eyebrow:"Setup · delete before presenting", title:["How to build this QBR ","with Claude"], sub:["About 10 minutes per account.", " The CSM gives Claude an account and a date range. Claude pulls the data, fills the deck and drafts the story."] };
        pChrome(pptx, sl, s, "Setup", "2");
        pCards(sl, [
          {tag:"Step 1", title:"Ask Claude", body:"Paste the prompt below. Swap in the account name exactly as it appears in HubSpot and the start and end dates."},
          {tag:"Step 2", title:"Claude pulls the data", body:"HubSpot: success-plan goals, owners, health, requests. Snowflake: CRM outcomes (win rate, cycle, pipeline) and program usage. Plus the roadmap."},
          {tag:"Step 3", title:"Review and fill", body:"Check each number's source. Complete anything marked [CSM to fill] and edit the narrative."},
          {tag:"Step 4", title:"Present", body:"Open in PowerPoint or Keynote. For Google Slides use File › Import slides. Delete both setup slides first."}
        ], 4, 172, 250, 16);
        sl.addShape("rect", { x:P(56), y:P(442), w:P(1168), h:P(190), fill:{color:C.ink}, line:{color:C.ink,width:0} });
        sl.addText([{text:"PROMPT FOR CLAUDE", options:{bold:true,color:A,fontSize:9,breakLine:true}},{text:QBR.prompt, options:{color:"EDEFF4",fontSize:11.5, fontFace:"Courier New"}}],
          { x:P(78), y:P(452), w:P(1124), h:P(170), fontFace:FONT, valign:"top", margin:0, paraSpaceAfter:6 });
        return;
      }
      case "setupMap": {
        pChrome(pptx, sl, { eyebrow:"Setup · delete before presenting", title:["Where every number ","comes from"], sub:["One data block drives the deck.", " Claude fills it from these sources. Metric definitions stay the same for every account."] }, "Setup", "2");
        pTable(sl, { head:QBR.sourceMap.head, rows:QBR.sourceMap.rows, colW:[.2,.3,.16,.34], align:["l","l","l","l"] }, 172);
        return;
      }
      case "cover": case "close": {
        pDarkBase(pptx, sl); pMark(pptx, sl, 84, 64, true);
        const k = s.kind==="cover" ? "BUSINESS REVIEW" : `${M.vendor}  ×  ${M.customer}`.toUpperCase();
        sl.addText(k, { x:P(84), y:P(212), w:P(900), h:P(24), fontFace:FONT, fontSize:10, bold:true, color:A, charSpacing:2, margin:0 });
        sl.addText(s.kind==="cover" ? [{text:M.customer+" ", options:{color:C.white}},{text:M.periodLabel, options:{color:A}}] : [{text:"Thank you", options:{color:C.white}}],
          { x:P(84), y:P(240), w:P(1100), h:P(90), fontFace:FONT, fontSize:52, bold:true, margin:0, valign:"middle" });
        sl.addText(s.kind==="cover"?M.headline:QBR.close.line, { x:P(84), y:P(346), w:P(1000), h:P(40), fontFace:FONT, fontSize:18, color:"C9D0DE", margin:0 });
        if(s.kind==="cover") sl.addText(M.periodText, { x:P(84), y:P(426), w:P(330), h:P(42), fontFace:FONT, fontSize:12, bold:true, color:C.white, align:"center", valign:"middle", line:{color:A, width:1.25}, margin:0 });
        else sl.addText([{text:"Next review: ", options:{bold:true,color:A}},{text:QBR.close.nextReview, options:{color:C.white}}], { x:P(84), y:P(590), w:P(800), h:P(26), fontFace:FONT, fontSize:13, margin:0 });
        sl.addText(M.preparedBy, { x:P(84), y:P(640), w:P(800), h:P(22), fontFace:FONT, fontSize:10.5, color:"8F9AB0", margin:0 });
        return;
      }
      case "section": {
        pDarkBase(pptx, sl);
        sl.addText("SECTION", { x:P(84), y:P(190), w:P(300), h:P(22), fontFace:FONT, fontSize:9, bold:true, color:A, charSpacing:2, margin:0 });
        sl.addText([{text:s.n, options:{color:A, fontSize:100}},{text:"  / 04", options:{color:"8F9AB0", fontSize:32}}], { x:P(84), y:P(220), w:P(700), h:P(170), fontFace:FONT, bold:true, margin:0, valign:"middle" });
        sl.addText(s.title, { x:P(84), y:P(404), w:P(1100), h:P(70), fontFace:FONT, fontSize:38, bold:true, color:C.white, margin:0 });
        sl.addShape("rect", { x:P(84), y:P(488), w:P(56), h:P(5), fill:{color:A}, line:{color:A,width:0} });
        sl.addText(s.sub, { x:P(84), y:P(506), w:P(1000), h:P(32), fontFace:FONT, fontSize:15, color:"C9D0DE", margin:0 });
        pMark(pptx, sl, 1224-110, 654, true);
        return;
      }
    }
    pChrome(pptx, sl, s, num, total);
    const hasC = !!s.callout, cy = 588;
    if(s.kind==="agenda") pCards(sl, s.items.map(it=>({tag:it.n, title:it.t, body:it.b})), 2, 176, 460);
    if(s.kind==="cards") pCards(sl, s.items, s.cols, 176, hasC?390:476, 16);
    if(s.kind==="kpis") pTiles(sl, s.tiles, 188, 180);
    if(s.kind==="table") pTable(sl, s, 180);
    if(s.kind==="chart") pChart(pptx, sl, s, 176, hasC?396:476);
    if(s.kind==="grid") pCards(sl, s.items, 2, 176, hasC?390:476);
    if(s.kind==="reflect"){
      sl.addText("WHAT'S WORKING", { x:P(56), y:P(172), w:P(574), h:P(20), fontFace:FONT, fontSize:10, bold:true, color:"1F7A50", margin:0 });
      sl.addText("WHAT'S NEXT", { x:P(650), y:P(172), w:P(574), h:P(20), fontFace:FONT, fontSize:10, bold:true, color:A, margin:0 });
      const items=[]; QBR.reflection.working.forEach((w,i)=>items.push(w, QBR.reflection.next[i]));
      pCards(sl, items, 2, 200, 448, 16);
    }
    if(s.kind==="columns"){
      const w=(1168-40)/3;
      s.cols.forEach((c,i)=>{
        const x=56+i*(w+20);
        sl.addText([{text:c.head+"  ", options:{bold:true,fontSize:17,color:C.ink}},{text:c.sub, options:{fontSize:11,color:C.muted}}], { x:P(x), y:P(172), w:P(w), h:P(30), fontFace:FONT, margin:0, valign:"bottom" });
        sl.addShape("rect", { x:P(x), y:P(206), w:P(w), h:P(3), fill:{color:i===0?A:C.ink}, line:{color:i===0?A:C.ink,width:0} });
      });
      const items=[]; [0,1].forEach(r=>s.cols.forEach(c=>items.push({title:c.items[r].title, body:c.items[r].body})));
      pCards(sl, items, 3, 222, 350, 14);
    }
    if(s.kind==="team"){
      QBR.team.forEach((p,i)=>{
        const x = 640 - 404 + i*428, y=190;
        sl.addShape("rect", { x:P(x), y:P(y), w:P(380), h:P(330), fill:{color:C.tint}, line:{color:C.tint,width:0} });
        sl.addText(p.name.startsWith("[")?"?":p.name.split(" ").map(x=>x[0]).join("").slice(0,2), { shape:pptx.ShapeType.ellipse, x:P(x+148), y:P(y+34), w:P(84), h:P(84), fill:{color:C.accentSoft}, line:{color:A,width:1.5}, color:A, bold:true, fontFace:FONT, fontSize:20, align:"center", valign:"middle" });
        sl.addText([{text:p.name, options:{bold:true,fontSize:17,color:p.name.startsWith("[")?"9A5A00":C.ink,breakLine:true}},{text:p.role, options:{bold:true,fontSize:11,color:A,breakLine:true}},{text:p.body, options:{fontSize:11.5,color:C.ink2}}],
          { x:P(x+24), y:P(y+140), w:P(332), h:P(170), fontFace:FONT, align:"center", valign:"top", margin:0, paraSpaceAfter:6 });
      });
    }
    pCallout(sl, s.callout, cy);
  });
  return pptx;
}

document.getElementById("btnPptx").addEventListener("click", async ()=>{
  const btn = document.getElementById("btnPptx");
  if(typeof PptxGenJS === "undefined"){ say("The PowerPoint library didn't load. Reload the page and try again."); return; }
  const dl = downloadsP ? await downloadsP : null;
  if(!dl){
    if(!window.claude){ try{ await buildPptx(document.getElementById("tgSetup").checked).writeFile({ fileName:`${M.customer} QBR ${M.periodLabel}.pptx` }); say("PowerPoint saved."); }catch(e){ say("Couldn't create the file."); } return; }
    say("Downloads aren't available in this view. Open the artifact on claude.ai to download."); return;
  }
  btn.disabled = true; say("Building PowerPoint…");
  try{
    const blob = await buildPptx(document.getElementById("tgSetup").checked).write({ outputType:"blob" });
    const r = await dl.save({ filename:`${M.customer} QBR ${M.periodLabel}.pptx`, data:blob });
    say(r.status==="saved" ? "PowerPoint saved." : "PowerPoint sent.");
  }catch(e){
    say(e && e.code==="declined" ? "Download cancelled." : "Couldn't create the file" + (e && e.message ? ": "+e.message : "."));
  }finally{ btn.disabled = false; }
});
